name: Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0). Leave empty to use tag or 0.1.0."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($v) -and $env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.1.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer version: $v"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Host + Speaker (self-contained)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/publish-speaker | Out-Null
          dotnet publish src/Chorus.Host/Chorus.Host.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/publish
          if (-not (Test-Path "artifacts/publish/Chorus.Host.exe")) { throw "Host publish failed" }

          dotnet publish src/Chorus.SpeakerApp/Chorus.SpeakerApp.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/publish-speaker
          if (-not (Test-Path "artifacts/publish-speaker/Chorus.SpeakerApp.exe")) { throw "Speaker publish failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup ISCC.exe not found" }

      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\ChorusHost.iss"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\ChorusSpeaker.iss"
          Get-ChildItem "artifacts\installer\*.exe" | ForEach-Object {
            Write-Host "Built $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-Windows-Setup-${{ steps.ver.outputs.version }}
          path: |
            artifacts/installer/ChorusHost-Setup-*.exe
            artifacts/installer/ChorusSpeaker-Setup-*.exe
          if-no-files-found: error

      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Chorus Windows ${{ steps.ver.outputs.version }}
          files: |
            artifacts/installer/ChorusHost-Setup-*.exe
            artifacts/installer/ChorusSpeaker-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
